<style>
:root{
  /* Halloween */
  --void:#07040b;
  --bruise:#1d0a1f;
  --blood:#9e0f12;
  --ember:#ff5a1f;
  --candle:#ffb13b;
  --bone:#f3e7d3;
  --muted:rgba(243,231,211,.66);
  /* Diwali */
  --night:#0b0820;
  --plum:#2a0b2e;
  --gold:#f6d27a;
  --gold-deep:#c9a24a;
  --marigold:#ff9f1c;
  --rani:#e0218a;
  --peacock:#0fa3a3;
  --cream:#fff4dc;

  --scary:"Creepster", "IM Fell English", Georgia, serif;
  --serif:"IM Fell English", Georgia, "Times New Roman", serif;
  --festive:"Yatra One", "IM Fell English", Georgia, serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --slide-ms:4800ms;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--bone);
  background:radial-gradient(100% 70% at 25% 0%, #3a0c1a 0%, var(--bruise) 38%, var(--void) 78%);
  background-color:var(--void);
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden}

/* ================= Gate ================= */
#gate{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;text-align:center;
  background:radial-gradient(60% 50% at 50% 50%, #1a0610 0%, #030104 75%);
  transition:opacity 1.4s ease, visibility 1.4s;
}
#gate.gone{opacity:0;visibility:hidden}
#gate .line{font-family:var(--serif);font-style:italic;font-size:clamp(1.15rem,3.6vw,1.6rem);color:var(--muted);max-width:24ch;line-height:1.4;
  animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
#enterBtn{
  font:400 clamp(1.6rem,6vw,2.3rem) var(--scary);letter-spacing:.04em;color:var(--bone);
  background:transparent;border:1px solid rgba(255,90,31,.55);border-radius:14px;padding:16px 30px;cursor:pointer;
  text-shadow:0 0 14px rgba(255,90,31,.9);box-shadow:0 0 30px -6px rgba(255,90,31,.6), inset 0 0 24px -8px rgba(255,90,31,.5);
  transition:transform .2s, box-shadow .2s;
}
#enterBtn:hover{transform:scale(1.04);box-shadow:0 0 44px -4px rgba(255,90,31,.85), inset 0 0 30px -8px rgba(255,90,31,.7)}
#enterBtn:focus-visible{outline:2px solid var(--candle);outline-offset:4px}
#gate .note{font-size:.88rem;color:rgba(243,231,211,.45)}
.gate-eyes{display:flex;gap:18px}
.gate-eyes i{width:16px;height:7px;border-radius:50%;background:#ff3b1a;box-shadow:0 0 12px 3px rgba(255,40,10,.8);animation:blink 5s infinite}

/* ================= Layers ================= */
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#halloween{position:fixed;inset:0;z-index:1;pointer-events:none;transition:opacity 1.6s ease .5s}
#diwali{position:fixed;inset:0;z-index:2;pointer-events:none;
  clip-path:circle(0px at var(--wx,50%) var(--wy,50%));
  transition:clip-path 2.1s cubic-bezier(.65,0,.25,1)}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#flash{position:fixed;inset:0;z-index:45;pointer-events:none;background:#dfe6ff;opacity:0}

body.diwali #halloween{opacity:0}
body.diwali #diwali{clip-path:circle(170vmax at var(--wx,50%) var(--wy,50%))}
body:not(.diwali) #diwali *,body:not(.diwali) .decor *{animation-play-state:paused}
.decor{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.stage > :not(.decor){position:relative;z-index:1}

/* ================= Halloween scenery ================= */
#bolt{position:fixed;inset:0;width:100%;height:100%;z-index:1}
.moon{
  position:fixed;z-index:1;
  top:clamp(18px,5vh,56px);left:clamp(14px,7vw,110px);
  width:clamp(120px,20vw,210px);aspect-ratio:1;border-radius:50%;
  background:
    radial-gradient(circle at 30% 35%, rgba(90,10,10,.35) 0 9%, transparent 10%),
    radial-gradient(circle at 62% 60%, rgba(90,10,10,.3) 0 12%, transparent 13%),
    radial-gradient(circle at 70% 28%, rgba(90,10,10,.28) 0 6%, transparent 7%),
    radial-gradient(circle at 40% 72%, rgba(90,10,10,.25) 0 5%, transparent 6%),
    radial-gradient(circle at 42% 40%, #ffc2a0, #e0502c 55%, #7a1410);
  box-shadow:0 0 70px 14px rgba(220,40,20,.4), 0 0 200px 60px rgba(160,10,10,.22);
}
.cloud{position:fixed;z-index:1;width:clamp(260px,45vw,560px);height:90px;border-radius:50%;
  background:radial-gradient(closest-side, rgba(10,4,12,.95), rgba(10,4,12,0));filter:blur(6px);
  animation:cloud linear infinite}
.cloud.a{top:clamp(40px,9vh,110px);animation-duration:55s}
.cloud.b{top:clamp(90px,17vh,190px);animation-duration:80s;animation-delay:-35s;opacity:.8}
@keyframes cloud{from{transform:translateX(-60vw)}to{transform:translateX(130vw)}}

.bat{position:fixed;z-index:2;left:-60px;fill:#050208;animation:fly linear infinite}
.bat svg{width:100%;display:block;animation:flap .25s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.3)}}
@keyframes fly{
  0%{transform:translate(0,0)}25%{transform:translate(28vw,-5vh)}50%{transform:translate(55vw,4vh)}
  75%{transform:translate(82vw,-6vh)}100%{transform:translate(115vw,1vh)}
}
.ghost{position:fixed;z-index:1;top:30vh;right:-120px;width:90px;opacity:0;animation:haunt 28s ease-in-out 6s infinite}
.ghost svg{display:block;animation:bob 3s ease-in-out infinite}
@keyframes haunt{
  0%{transform:translateX(0);opacity:0}8%{opacity:.4}45%{opacity:.25}
  60%{transform:translateX(-120vw);opacity:0}100%{transform:translateX(-120vw);opacity:0}
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.eyes{position:fixed;z-index:3;display:flex;gap:9px;opacity:0;transition:opacity 1.2s}
.eyes.on{opacity:1}
.eyes i{width:11px;height:5px;border-radius:50%;background:#ff2a12;box-shadow:0 0 10px 3px rgba(255,30,10,.75);animation:blink 4s infinite}
@keyframes blink{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
.ground{position:fixed;left:0;right:0;bottom:0;z-index:2;height:clamp(120px,22vh,200px)}
.ground svg{width:100%;height:100%;display:block}
.fog{position:fixed;left:-25%;right:-25%;bottom:-40px;height:200px;z-index:2;
  background:radial-gradient(50% 60% at 30% 60%, rgba(190,170,210,.2), transparent 70%),
             radial-gradient(40% 50% at 75% 70%, rgba(190,170,210,.16), transparent 70%);
  filter:blur(10px);animation:drift 20s ease-in-out infinite alternate}
.fog.two{animation-duration:28s;animation-direction:alternate-reverse;bottom:-10px;z-index:3}
@keyframes drift{from{transform:translateX(-7%)}to{transform:translateX(7%)}}
.spider{position:fixed;top:0;right:clamp(80px,14vw,200px);z-index:4;transform-origin:top center;animation:dangle 6s ease-in-out infinite}
@keyframes dangle{0%,100%{transform:translateY(-30px) rotate(3deg)}40%{transform:translateY(20px) rotate(-3deg)}55%{transform:translateY(-6px)}}
.vignette{position:fixed;inset:0;z-index:40;pointer-events:none;
  background:radial-gradient(75% 70% at 50% 50%, transparent 55%, rgba(0,0,0,.75) 100%);
  animation:flickerV 7s steps(1) infinite;transition:opacity 1.5s}
@keyframes flickerV{0%,100%{opacity:1}91%{opacity:.6}92%{opacity:1}94%{opacity:.75}95%{opacity:1}}
body.diwali .vignette{animation:none;opacity:0}

/* ================= Diwali scenery ================= */
.dsky{position:absolute;inset:0;
  background:
    radial-gradient(90% 45% at 50% 108%, rgba(255,140,40,.42), rgba(255,140,40,0) 70%),
    radial-gradient(60% 40% at 50% 0%, rgba(110,40,140,.35), rgba(110,40,140,0) 70%),
    linear-gradient(180deg, rgba(8,6,28,.94) 0%, rgba(26,10,46,.96) 55%, #3a0f2c 100%)}
.toran{position:absolute;top:0;left:0;right:0;height:112px;
  transform:translateY(-120%);transition:transform 1.4s cubic-bezier(.2,1.25,.35,1) .9s;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.toran svg{display:block}
body.diwali .toran{transform:none}

.lantern{position:absolute;top:0;width:clamp(34px,4.4vw,56px);transform-origin:50% 0;
  transform:translateY(-100%);transition:transform 1.6s cubic-bezier(.2,1.2,.35,1) 1.2s}
.lantern svg{display:block;width:100%;overflow:visible;animation:swing 4.6s ease-in-out infinite alternate;transform-origin:50% 0}
.lantern::after{content:"";position:absolute;left:50%;top:60%;width:260%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle, rgba(255,120,170,.28), rgba(255,160,60,.12) 40%, transparent 68%);
  animation:glowPulse 3s ease-in-out infinite alternate}
.lantern.l1{left:clamp(10px,4vw,80px)}
.lantern.l2{right:clamp(68px,8vw,150px)}
.lantern.l2 svg{animation-delay:-2.3s}
body.diwali .lantern{transform:none}
@keyframes swing{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes glowPulse{from{opacity:.65}to{opacity:1}}

.diyas{position:absolute;left:0;right:0;bottom:0;height:clamp(84px,13vh,120px);
  display:flex;justify-content:space-around;align-items:flex-end;
  padding:0 2vw calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top, rgba(30,6,18,.96) 0%, rgba(30,6,18,.6) 45%, rgba(30,6,18,0) 100%)}
.diya{position:relative;width:clamp(42px,6vw,70px);opacity:0;transform:translateY(16px);
  transition:opacity .8s ease, transform .8s ease;transition-delay:calc(1.1s + var(--n) * .12s)}
body.diwali .diya{opacity:1;transform:none}
.diya svg{display:block;width:100%;overflow:visible}
.flame{position:absolute;left:84%;bottom:58%;width:24%;aspect-ratio:.55;margin-left:-12%;
  border-radius:50% 50% 50% 50% / 64% 64% 36% 36%;
  background:radial-gradient(ellipse at 50% 74%, #fff 0 16%, #ffe680 30%, #ffa62b 56%, rgba(255,90,0,0) 74%);
  transform-origin:50% 92%;animation:flicker var(--fd) ease-in-out var(--dl) infinite alternate}
.flame::after{content:"";position:absolute;left:50%;top:55%;width:620%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle, rgba(255,170,60,.34), rgba(255,120,30,.1) 40%, transparent 66%);pointer-events:none}
@keyframes flicker{
  0%{transform:scale(1,1) rotate(-2deg)}30%{transform:scale(.9,1.1) rotate(2.5deg)}
  60%{transform:scale(1.06,.93) rotate(-1deg)}100%{transform:scale(.96,1.06) rotate(1.5deg)}
}

/* ================= Controls ================= */
#muteBtn{
  position:fixed;z-index:70;top:calc(14px + env(safe-area-inset-top,0px));right:14px;
  width:46px;height:46px;border-radius:50%;border:1px solid rgba(243,231,211,.25);
  background:rgba(10,4,12,.6);color:var(--bone);cursor:pointer;display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)
}
#muteBtn.show{display:flex}
#muteBtn:focus-visible{outline:2px solid var(--candle);outline-offset:3px}
#muteBtn svg{width:22px;height:22px}

/* ================= Stage ================= */
.stage{
  position:relative;z-index:10;min-height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,2.6vh,24px);
  padding:clamp(76px,11vh,104px) 20px clamp(130px,22vh,200px);
  text-align:center;
}
.swap{transition:opacity .55s ease, transform .55s ease}
.swap.out{opacity:0;transform:translateY(6px)}
.from{font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,2.8vw,1.25rem);color:var(--muted)}
.from b{font-style:normal;font-weight:400;color:var(--candle)}
body.diwali .from{font-family:var(--sans);font-style:normal;font-weight:500;font-size:clamp(.95rem,2.4vw,1.05rem);letter-spacing:.02em;color:rgba(255,236,200,.75)}
body.diwali .from b{font-weight:600;color:var(--gold)}

.titles{display:flex;flex-direction:column;align-items:center;gap:6px}
h1{
  font-family:var(--scary);font-weight:400;
  font-size:clamp(2.6rem,9vw,5rem);line-height:1;letter-spacing:.02em;max-width:13ch;
  color:#ff4a1c;
  text-shadow:0 0 12px rgba(255,60,20,.7), 0 0 40px rgba(180,10,10,.6), 0 3px 0 #2a0204;
  animation:flickerT 6s infinite;
}
@keyframes flickerT{0%,100%{opacity:1}88%{opacity:1}89%{opacity:.35}90%{opacity:1}92%{opacity:.5}93%{opacity:1}}
body.sweet h1{animation:none}
h1.festive{
  font-family:var(--festive);font-size:clamp(2.5rem,8.4vw,4.6rem);line-height:1.15;letter-spacing:.01em;text-shadow:none;
  background:linear-gradient(100deg, #e9b955 0%, #fff3cf 22%, #f6d27a 38%, #ff9f1c 55%, #fff3cf 72%, #e9b955 100%);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(255,170,60,.45)) drop-shadow(0 2px 0 rgba(60,10,20,.6));
  animation:shimmer 6s linear infinite;
}
@keyframes shimmer{from{background-position:0% 50%}to{background-position:-260% 50%}}
.subline{font-family:var(--festive);font-size:clamp(1rem,2.8vw,1.25rem);color:rgba(246,210,122,.8);
  height:0;opacity:0;overflow:hidden;transition:opacity .8s ease .5s, height .5s ease}
body.diwali .subline{height:1.7em;opacity:1}

/* ================= Card ================= */
.card-wrap{position:relative;width:min(86vw,390px)}
.card-wrap::before{content:"";position:absolute;inset:-14%;z-index:-1;border-radius:50%;
  background:radial-gradient(circle, rgba(255,80,20,.5), rgba(150,10,10,.25) 45%, transparent 68%);
  filter:blur(22px);animation:candle 2.6s ease-in-out infinite;transition:background 1.5s}
body.diwali .card-wrap::before{background:radial-gradient(circle, rgba(255,190,90,.42), rgba(224,33,138,.18) 45%, transparent 68%)}
@keyframes candle{0%,100%{opacity:.8;transform:scale(1)}30%{opacity:1;transform:scale(1.03)}50%{opacity:.6}75%{opacity:.95}}
.card{
  position:relative;width:100%;aspect-ratio:4/5;border-radius:26px;overflow:hidden;background:#12060f;
  box-shadow:0 0 0 1px rgba(255,90,31,.4), 0 0 0 7px rgba(7,4,11,.95), 0 0 0 8px rgba(158,15,18,.45),
             0 30px 70px -18px rgba(0,0,0,.9);
  isolation:isolate;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:box-shadow 1.5s ease;
}
body.diwali .card{box-shadow:0 0 0 1px rgba(246,210,122,.65), 0 0 0 7px rgba(14,8,34,.96), 0 0 0 8px rgba(246,210,122,.4),
  0 0 60px -10px rgba(255,170,60,.5), 0 30px 70px -18px rgba(0,0,0,.9)}
.card.lit{touch-action:pan-y}
.reveal{position:absolute;inset:0}

/* ---------- Diwali panel (under the scratch) ---------- */
.dpanel{position:absolute;inset:0;z-index:3;overflow:hidden;
  background:
    radial-gradient(60% 45% at 50% 52%, rgba(255,170,70,.22), rgba(255,170,70,0) 70%),
    radial-gradient(80% 65% at 50% 50%, #4a1240 0%, #2a0b30 55%, #120820 100%);
  transition:opacity 1s ease .5s, visibility 1s .5s}
.card.lit .dpanel{opacity:0;visibility:hidden}
.dpanel::before{content:"";position:absolute;inset:10px;border-radius:18px;border:1px solid rgba(246,210,122,.28);pointer-events:none}
.dline{position:absolute;left:0;right:0;top:7.5%;padding:0 26px;
  font-family:var(--festive);font-size:clamp(1.05rem,4.4vw,1.4rem);line-height:1.3;color:var(--gold);
  text-shadow:0 0 18px rgba(255,170,60,.45);text-wrap:balance}
.rangoli{position:absolute;left:50%;top:51%;width:76%;aspect-ratio:1;transform:translate(-50%,-50%)}
.rangoli svg{display:block;width:100%;height:100%;overflow:visible}
.card.revealed .rangoli svg{animation:spin 110s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rangoli .ring{transform-box:view-box;transform-origin:50% 50%}
.card.revealed .rangoli .ring{animation:bloom 1.5s cubic-bezier(.2,.8,.25,1.15) both;animation-delay:calc((6 - var(--i)) * .11s + .25s)}
@keyframes bloom{0%{transform:scale(.55) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.rangoli::after{content:"";position:absolute;inset:30%;border-radius:50%;
  background:radial-gradient(circle, rgba(255,200,110,.45), transparent 70%);filter:blur(6px);pointer-events:none}

.anaar{position:absolute;left:50%;top:51%;width:17%;transform:translate(-50%,-66%);z-index:2;
  background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.anaar svg{display:block;width:100%;overflow:visible;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.anaar:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:8px}
.wick-glow{opacity:0}
.card.revealed:not(.igniting) .wick-glow{animation:wick 1.4s ease-in-out infinite}
@keyframes wick{0%,100%{opacity:.2}50%{opacity:1}}

.light-btn{position:absolute;left:50%;bottom:6.5%;transform:translate(-50%,14px);z-index:3;opacity:0;pointer-events:none;
  display:inline-flex;align-items:center;gap:9px;white-space:nowrap;
  font:700 1rem var(--sans);letter-spacing:.01em;color:#2a0a10;
  padding:13px 22px 13px 18px;border:0;border-radius:999px;cursor:pointer;
  background:linear-gradient(180deg,#fff0c2 0%, var(--gold) 45%, #e8a93c 100%);
  box-shadow:0 0 0 1px rgba(255,240,200,.6) inset, 0 10px 28px -8px rgba(255,170,60,.9);
  transition:opacity .7s ease 1.6s, transform .7s ease 1.6s, filter .2s}
.light-btn svg{width:20px;height:20px}
.light-btn::after{content:"";position:absolute;inset:-6px;border-radius:999px;border:1.5px solid rgba(246,210,122,.7);
  animation:ping 2s ease-out infinite;pointer-events:none}
@keyframes ping{0%{opacity:.9;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}
.light-btn:hover{filter:brightness(1.07)}
.light-btn:focus-visible{outline:2px solid var(--cream);outline-offset:5px}
.card.revealed .light-btn{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.card.igniting .light-btn{opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .3s, transform .3s}

/* ---------- Photo slideshow ---------- */
.slides{position:absolute;inset:0;overflow:hidden;
  clip-path:circle(0% at var(--cx,50%) var(--cy,45%));
  transition:clip-path 1.6s cubic-bezier(.7,0,.2,1)}
.card.lit .slides{clip-path:circle(150% at var(--cx,50%) var(--cy,45%))}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.3s ease;overflow:hidden}
.slide.active{opacity:1;z-index:1}
.slide.broken{display:none}
.slide .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;
  filter:blur(22px) brightness(.5) saturate(1.2)}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform-origin:var(--focus,50% 50%)}
.slide.contain img{object-fit:contain}
.card.playing .slide.active img{animation:kenburns calc(var(--slide-ms) + 1500ms) ease-out forwards}
@keyframes kenburns{from{transform:scale(1.07)}to{transform:scale(1)}}
.slides::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;z-index:2;pointer-events:none;
  background:linear-gradient(to top, rgba(11,8,32,.7), rgba(11,8,32,0))}
.fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:2;
  background:radial-gradient(circle at 50% 40%, #ffe0b0, #ff9a3c 55%, #b8480c);color:#2a0a14;font-family:var(--festive)}
.fallback.show{display:flex}
.fallback .big{font-size:5.5rem;line-height:1}
.fallback .txt{font-size:1.5rem}

.ss-ui{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .8s ease 1.2s}
.card.lit .ss-ui{opacity:1}
.card.lit .ss-ui > *{pointer-events:auto}
.ss-arrow{position:absolute;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;
  border:1px solid rgba(255,240,210,.32);background:rgba(11,8,32,.38);color:var(--cream);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s, transform .2s}
.ss-arrow:hover{background:rgba(11,8,32,.6)}
.ss-arrow:active{transform:scale(.94)}
.ss-arrow:focus-visible,.ss-dots button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ss-arrow svg{width:18px;height:18px}
.ss-prev{left:12px}
.ss-next{right:12px}
.ss-dots{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:8px}
.ss-dots button{position:relative;width:8px;height:8px;border-radius:8px;border:0;padding:0;cursor:pointer;overflow:hidden;
  background:rgba(255,240,210,.42);transition:width .4s ease, background .3s}
.ss-dots button::before{content:"";position:absolute;inset:-10px}
.ss-dots button.active{width:30px;background:rgba(255,240,210,.3)}
.ss-dots button span{position:absolute;inset:0;width:0;background:var(--gold);border-radius:8px}
.ss-dots button.active span{width:100%}
.card.playing .ss-dots button.active span{animation:dotfill var(--slide-ms) linear forwards}
@keyframes dotfill{from{width:0}to{width:100%}}

/* ---------- Scratch layer ---------- */
#scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;z-index:5;
  transition:opacity 1.1s ease, transform 1.1s ease, filter 1.1s ease}
#scratch:active{cursor:grabbing}
#scratch.gone{opacity:0;transform:scale(1.1);filter:blur(8px) brightness(2);pointer-events:none}
.hint{position:absolute;left:50%;bottom:9%;z-index:6;pointer-events:none;width:44px;height:44px;margin-left:-22px;
  animation:swipe 2.4s ease-in-out infinite;transition:opacity .3s}
.hint.off{opacity:0;animation:none}
@keyframes swipe{0%{transform:translate(-55px,0);opacity:0}15%{opacity:1}50%{transform:translate(55px,-8px)}85%{opacity:1}100%{transform:translate(-55px,0);opacity:0}}

/* ---------- Progress ---------- */
.meter{display:flex;align-items:center;gap:12px;width:min(86vw,390px);color:var(--muted);font-size:.9rem}
.track{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.track span{display:block;height:100%;width:0;border-radius:5px;
  background:linear-gradient(90deg,#5a0508,var(--blood),var(--ember));box-shadow:0 0 10px rgba(255,40,20,.9);transition:width .25s}
.meter output{min-width:3.2ch;text-align:right;font-variant-numeric:tabular-nums}
.meter.done{opacity:0;height:0;margin:-14px 0;overflow:hidden;transition:all .5s}

/* ---------- The news ---------- */
.after{display:flex;flex-direction:column;align-items:center;gap:12px;
  max-height:0;opacity:0;overflow:hidden;transform:translateY(14px);
  transition:max-height 1s ease, opacity 1s ease .3s, transform 1s ease .3s}
.after.show{max-height:520px;opacity:1;transform:none}
.after h2{
  font-family:var(--festive);font-weight:400;font-size:clamp(1.9rem,6.6vw,3rem);line-height:1.15;max-width:16ch;text-wrap:balance;
  background:linear-gradient(180deg,#fffaf0 10%,var(--gold) 55%,var(--marigold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,160,60,.45));
}
.after p{font-family:var(--sans);font-size:clamp(1rem,2.6vw,1.12rem);color:rgba(255,240,215,.82);max-width:34ch;line-height:1.6;text-wrap:pretty}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.actions button{font:600 .98rem var(--sans);border:0;border-radius:999px;padding:13px 22px;cursor:pointer;transition:transform .15s, filter .2s, background .2s}
.actions button:active{transform:scale(.97)}
.actions button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.primary{background:linear-gradient(180deg,#fff0c2,var(--gold) 50%,#e8a93c);color:#2a0a10;box-shadow:0 8px 24px -8px rgba(255,170,60,.85)}
.primary:hover{filter:brightness(1.07)}
.ghostBtn{background:rgba(255,255,255,.06);color:var(--cream);box-shadow:inset 0 0 0 1px rgba(255,240,210,.28)}
.ghostBtn:hover{background:rgba(255,255,255,.12)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;
  transform:translate(-50%,20px);opacity:0;background:var(--cream);color:#1a0b1e;
  font-weight:600;font-size:.92rem;padding:11px 18px;border-radius:999px;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

body.sweet .eyes{display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:520px){
  .spider{right:70px;transform:scale(.8)}
  .ss-arrow{width:36px;height:36px;margin-top:-18px}
  .light-btn{font-size:.95rem;padding:12px 20px 12px 16px}
}
@media (prefers-reduced-motion: reduce){
  .bat,.fog,.spider,.hint,.card-wrap::before,.cloud,.ghost,.vignette,h1,.eyes i,#gate .line,
  .lantern svg,.flame,.light-btn::after,h1.festive{animation:none}
  .card.revealed .rangoli svg,.card.revealed .rangoli .ring,.card.playing .slide.active img{animation:none}
  .bat,.ghost,.cloud{display:none}
  #diwali,.slides{transition:none}
}

<script>
/* =========================================================
   ✏️  CONFIG — change these to update the page
   ========================================================= */
const CONFIG = {
  names:          "Shivani & Parth",

  // Part 1 — Halloween (before the scratch)
  halloweenFrom:  "A message from",
  headline:       "Something is coming…",

  // Part 2 — Diwali (after the scratch)
  diwaliFrom:     "With love and light from",
  diwaliHeadline: "Happy Diwali",
  diwaliSubline:  "शुभ दीपावली",
  panelLine:      "Some news is too bright to keep in the dark",
  lightLabel:     "Light the firework",

  // Part 3 — the news (after the firework)
  revealTitle:    "A Little Ladoo is on the way!",
  revealMessage:  "We're having a baby, arriving spring 2027. Happy Diwali from the soon-to-be three of us.",

  // Slideshow photos (in the "photos" folder next to this file)
  //   fit:   "cover" fills the frame, "contain" shows the whole photo on a soft blurred backdrop
  //   focus: which part of the photo to keep in view when it's cropped, e.g. "50% 30%"
  photos: [
    { src:"photos/1-car.jpg",     alt:"Holding up the ultrasound and baby booties in the car, wearing Dad and Mom caps", fit:"contain" },
    { src:"photos/2-tree.jpg",    alt:"Posing under an autumn tree with the ultrasound and booties", focus:"50% 70%" },
    { src:"photos/3-booties.jpg", alt:"Two hands holding tiny knitted baby booties", focus:"50% 55%" },
    { src:"photos/4-bench.jpg",   alt:"Sitting on a stone bench in the fall leaves with our dog holding the ultrasound", focus:"50% 70%" }
  ],
  slideSeconds:   4.8,   // how long each photo stays on screen
  revealAt:       0.55,  // reveal automatically after 55% is scratched
  lightning:      true   // lightning flashes in the Halloween part
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
let revealed = false, lit = false, started = false;
let showTimers = [], ambientTimer = null;
const later = (fn, ms) => showTimers.push(setTimeout(fn, ms));

/* ---------- Text ---------- */
$("names").textContent = CONFIG.names;
$("fromText").textContent = CONFIG.halloweenFrom;
$("headline").textContent = CONFIG.headline;
$("subline").textContent = CONFIG.diwaliSubline;
$("dline").textContent = CONFIG.panelLine;
$("lightLabel").textContent = CONFIG.lightLabel;
$("revealTitle").textContent = CONFIG.revealTitle;
$("revealMessage").textContent = CONFIG.revealMessage;

function setScene(diwali){
  const h = $("headline"), f = $("fromLine");
  h.classList.add("out"); f.classList.add("out");
  setTimeout(() => {
    h.textContent = diwali ? CONFIG.diwaliHeadline : CONFIG.headline;
    h.classList.toggle("festive", diwali);
    $("fromText").textContent = diwali ? CONFIG.diwaliFrom : CONFIG.halloweenFrom;
    h.classList.remove("out"); f.classList.remove("out");
  }, 560);
}

/* =========================================================
   🪔 DIWALI DECOR — rangoli, toran, diyas
   ========================================================= */
function buildRangoli(){
  const petal = (r0,r1,w) => `M0 ${-r0} Q${w} ${-(r0+r1)/2} 0 ${-r1} Q${-w} ${-(r0+r1)/2} 0 ${-r0}Z`;
  const ring = (n, fn, rot=0) => { let s = ""; for(let i=0;i<n;i++) s += `<g transform="rotate(${rot + 360*i/n})">${fn(i)}</g>`; return s; };
  const rings = [
    `<circle r="15" fill="#3a0d36" stroke="#f6d27a" stroke-width="1"/>` +
      ring(8, () => `<circle cx="0" cy="-11" r="1.6" fill="#f6d27a"/>`),
    ring(8, i => `<path d="${petal(16,35,11)}" fill="${i%2 ? '#ff9f1c' : '#e0218a'}" stroke="#f6d27a" stroke-width=".8"/>`),
    ring(12, () => `<path d="${petal(32,57,14)}" fill="#0fa3a3" stroke="#f6d27a" stroke-width=".8"/><path d="${petal(38,51,6)}" fill="#9be8de"/>`, 15),

function marigold(x, y, alt, r=7.5){
  const c1 = alt ? "#ff9f1c" : "#ffc300", c2 = alt ? "#e85d04" : "#ff9f1c";
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="${r}" fill="${c2}"/>` +
    `<circle r="${(r-1.3).toFixed(1)}" fill="${c1}" stroke="${c2}" stroke-width="2" stroke-dasharray="1.6 1.4"/>` +
    `<circle r="${(r*.3).toFixed(1)}" fill="${c2}"/></g>`;
}
function buildToran(){
  const W = Math.max(300, document.querySelector('.stage').clientWidth), small = W < 600, swags = Math.max(2, Math.round(W/230)), seg = W/swags, top = 20, depth = small ? 28 : 44, hang = small ? 2 : 4;
  let s = `<svg width="${W}" height="112" viewBox="0 0 ${W} 112">`;
  s += `<path d="M0 5 H${W}" stroke="#c9a24a" stroke-width="2"/>`;
  for(let x=7, k=0; x<W; x+=14, k++){
    s += `<g transform="translate(${x} 5)"><path d="M0 0 Q6.5 9 0 21 Q-6.5 9 0 0Z" fill="${k%2 ? '#2d6a4f' : '#52b788'}"/><path d="M0 2 V18" stroke="#1b4332" stroke-width=".6"/></g>`;
  }
  const dangle = x => { let d = ""; for(let k=0;k<hang;k++) d += marigold(x, top+12+k*13, (k+1)%2, 6); return d + `<path transform="translate(${x} ${top+14+hang*13})" d="M-3 0 H3 L0 9Z" fill="#f6d27a"/>`; };
  for(let i=0;i<swags;i++){
    const x0 = i*seg, x1 = x0+seg, xm = (x0+x1)/2, n = Math.max(8, Math.round(seg/13));
    for(let k=0;k<=n;k++){
      const t = k/n, x = (1-t)*(1-t)*x0 + 2*(1-t)*t*xm + t*t*x1, y = (1-t)*(1-t)*top + 2*(1-t)*t*(top+depth*2) + t*t*top;
      s += marigold(x, y, k%2);
    }
    s += dangle(i === 0 ? 10 : x0);
  }
  s += dangle(W-10) + "</svg>";
  $("toran").innerHTML = s;
}
function buildDiyas(){
  const n = innerWidth < 560 ? 5 : innerWidth < 1000 ? 7 : 9;
  let h = "";
  for(let i=0;i<n;i++){

/* =========================================================
   🖼️ SLIDESHOW
   ========================================================= */
const Slideshow = {
  slides:[], dots:[], index:0, timer:null, playing:false, broken:0,

  build(){
    const box = $("slides"), dotsBox = $("ssDots");
    document.documentElement.style.setProperty("--slide-ms", (CONFIG.slideSeconds*1000) + "ms");
    CONFIG.photos.forEach((p,i) => {
      const s = document.createElement("div");
      s.className = "slide" + (p.fit === "contain" ? " contain" : "") + (i === 0 ? " active" : "");
      s.setAttribute("role","group");
      s.setAttribute("aria-roledescription","slide");
      s.setAttribute("aria-label", `Photo ${i+1} of ${CONFIG.photos.length}`);
      if(i !== 0) s.setAttribute("aria-hidden","true");
      const bg = document.createElement("div"); bg.className = "bg"; bg.style.backgroundImage = `url("${p.src}")`;
      const img = document.createElement("img");
      img.alt = p.alt || ""; img.decoding = "async"; img.draggable = false;
      if(p.focus){ img.style.objectPosition = p.focus; s.style.setProperty("--focus", p.focus); }
      img.onerror = () => { s.classList.add("broken"); if(++this.broken === CONFIG.photos.length) $("fallback").classList.add("show"); };
      img.src = p.src;
      s.append(bg, img); box.appendChild(s); this.slides.push(s);

      const d = document.createElement("button");
      d.setAttribute("aria-label", `Show photo ${i+1}`);
      if(i === 0) d.classList.add("active");
      d.appendChild(document.createElement("span"));
      d.onclick = () => this.go(i);
      dotsBox.appendChild(d); this.dots.push(d);
    });
    if(this.slides.length < 2){ $("ssPrev").hidden = $("ssNext").hidden = dotsBox.hidden = true; }
    $("ssPrev").onclick = () => this.go(this.index - 1);
    $("ssNext").onclick = () => this.go(this.index + 1);

    let sx = null, sy = null;
    const card = $("card");
    card.addEventListener("pointerdown", e => { if(lit){ sx = e.clientX; sy = e.clientY; } });
    card.addEventListener("pointerup", e => {
      if(sx === null || !lit) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) this.go(this.index + (dx < 0 ? 1 : -1));
    });
    addEventListener("keydown", e => {
      if(!lit) return;
      if(e.key === "ArrowRight") this.go(this.index + 1);
      if(e.key === "ArrowLeft")  this.go(this.index - 1);
    });
    document.addEventListener("visibilitychange", () => {
      if(!this.playing) return;
      document.hidden ? clearTimeout(this.timer) : this.go(this.index, true);
    });
  },

  go(i, restart){
    const n = this.slides.length; if(!n) return;
    const dir = i < this.index ? -1 : 1;
    let next = ((i % n) + n) % n, guard = 0;
    while(this.slides[next].classList.contains("broken") && guard++ < n) next = (next + dir + n) % n;
    if(next !== this.index || restart){
      this.slides.forEach((s,k) => {
        s.classList.toggle("active", k === next);
        k === next ? s.removeAttribute("aria-hidden") : s.setAttribute("aria-hidden","true");
      });
      this.dots.forEach(d => { d.classList.remove("active"); d.removeAttribute("aria-current"); });
      void this.dots[next].offsetWidth;
      this.dots[next].classList.add("active"); this.dots[next].setAttribute("aria-current","true");
      this.index = next;
    }
    if(this.playing){ clearTimeout(this.timer); this.timer = setTimeout(() => this.go(this.index + 1), CONFIG.slideSeconds*1000); }
  },
  play(){
    if(this.slides.length < 2) return;
    this.playing = true; $("card").classList.add("playing");
    this.go(this.index, true);
  },
  reset(){
    this.playing = false; clearTimeout(this.timer);
    $("card").classList.remove("playing");
    this.index = -1; this.go(0, true);
  }
};
Slideshow.build();

/* =========================================================
   🎵 SOUND — everything is synthesised live, no audio files
   ========================================================= */
const Sound = {
  ctx:null, master:null, scary:null, sweet:null, tan:null, fw:null, send:null,
  muted:false, melodyOn:false, ragaOn:false, token:0, noise:null, cache:{},

  init(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = .9; this.master.connect(c.destination);

    const delay = c.createDelay(2); delay.delayTime.value = .42;
    const fb = c.createGain(); fb.gain.value = .38;
    const tone = c.createBiquadFilter(); tone.type = "lowpass"; tone.frequency.value = 2400;
    delay.connect(tone); tone.connect(fb); fb.connect(delay); tone.connect(this.master);
    this.send = c.createGain(); this.send.gain.value = .55; this.send.connect(delay);

    this.scary = c.createGain(); this.scary.gain.value = 0; this.scary.connect(this.master);
    this.sweet = c.createGain(); this.sweet.gain.value = 0; this.sweet.connect(this.master);
    const tanLP = c.createBiquadFilter(); tanLP.type = "lowpass"; tanLP.frequency.value = 2300;
    this.tan = c.createGain(); this.tan.gain.value = .9; this.tan.connect(tanLP); tanLP.connect(this.sweet);
    this.setupFireworks();

    const len = c.sampleRate*2, buf = c.createBuffer(1,len,c.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    this.noise = buf;

    this.drone(); this.wind(); this.startScary();
  },

  /* ----- Halloween ----- */
  startScary(){
    if(!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    this.scary.gain.cancelScheduledValues(t);
    this.scary.gain.setValueAtTime(this.scary.gain.value, t);
    this.scary.gain.linearRampToValueAtTime(1, t+3);
    this.sweet.gain.cancelScheduledValues(t);
    this.sweet.gain.setValueAtTime(this.sweet.gain.value, t);
    this.sweet.gain.linearRampToValueAtTime(0, t+1);
    this.token++; this.ragaOn = false;
    if(!this.melodyOn){ this.melodyOn = true; this.melody(); }
  },
  drone(){
    const c = this.ctx;
    const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 300; f.Q.value = 7;
    const g = c.createGain(); g.gain.value = .14;
    [[36.71,.3],[73.42,.25],[73.9,.22],[77.78,.1]].forEach(([fr,v]) => {
      const o = c.createOscillator(); o.type = "sawtooth"; o.frequency.value = fr;
      const og = c.createGain(); og.gain.value = v; o.connect(og); og.connect(f); o.start();
    });
    const lfo = c.createOscillator(); lfo.frequency.value = .06;
    const lg = c.createGain(); lg.gain.value = 170; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    f.connect(g); g.connect(this.scary);
  },
  wind(){
    const c = this.ctx, src = c.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 550; f.Q.value = 1.4;
    const g = c.createGain(); g.gain.value = .07;
    const lfo = c.createOscillator(); lfo.frequency.value = .09;
    const lg = c.createGain(); lg.gain.value = 380; lfo.connect(lg); lg.connect(f.frequency);
    const lfo2 = c.createOscillator(); lfo2.frequency.value = .05;
    const lg2 = c.createGain(); lg2.gain.value = .04; lfo2.connect(lg2); lg2.connect(g.gain);
    src.connect(f); f.connect(g); g.connect(this.scary);
    src.start(); lfo.start(); lfo2.start();
  },
  melody(){
    if(!this.melodyOn || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + .05;
    const notes = [293.66,349.23,415.30,440,523.25,587.33,369.99,311.13];
    const fr = pick(notes);
    if(Math.random() < .75){
      const o = c.createOscillator(); o.type = "sine"; o.frequency.value = fr;
      const vib = c.createOscillator(); vib.frequency.value = 5.2;
      const vg = c.createGain(); vg.gain.value = fr*.014; vib.connect(vg); vg.connect(o.frequency);
      o.frequency.setValueAtTime(fr*.97, t); o.frequency.linearRampToValueAtTime(fr, t+.6);
      const g = c.createGain(); g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.06, t+.9); g.gain.linearRampToValueAtTime(.045, t+1.8); g.gain.linearRampToValueAtTime(0, t+3.4);
      o.connect(g); g.connect(this.scary); g.connect(this.send);
      o.start(t); vib.start(t); o.stop(t+3.6); vib.stop(t+3.6);
    } else {
      [1,2.76,5.4].forEach((m,i) => {
        const o = c.createOscillator(); o.type = "sine"; o.frequency.value = fr/2*m;
        const g = c.createGain(); g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(.12/(i+1), t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+4.5);
        o.connect(g); g.connect(this.scary); g.connect(this.send); o.start(t); o.stop(t+4.6);
      });
    }
    setTimeout(() => this.melody(), rand(1700,3800));
  },
  thunder(delaySec){
    if(!this.ctx) return;
    const c = this.ctx, t = c.currentTime + delaySec;
    const src = c.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const f = c.createBiquadFilter(); f.type = "lowpass";
    f.frequency.setValueAtTime(1200, t); f.frequency.exponentialRampToValueAtTime(90, t+3.5);
    const g = c.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.7, t+.05); g.gain.exponentialRampToValueAtTime(.25, t+.8);
    g.gain.linearRampToValueAtTime(.35, t+1.2); g.gain.exponentialRampToValueAtTime(.0001, t+4.5);
    src.connect(f); f.connect(g); g.connect(this.scary);
    src.start(t); src.stop(t+4.6);
  },
  heartbeat(strength){
    if(!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    [[0,1],[.2,.65]].forEach(([dt,v]) => {
      const o = c.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(75, t+dt); o.frequency.exponentialRampToValueAtTime(38, t+dt+.16);
      const g = c.createGain(); g.gain.setValueAtTime(0,t+dt);
      g.gain.linearRampToValueAtTime(.55*v*strength, t+dt+.012); g.gain.exponentialRampToValueAtTime(.0001, t+dt+.22);
      o.connect(g); g.connect(this.scary); o.start(t+dt); o.stop(t+dt+.25);
    });
  },

  /* ----- Diwali: temple bell, tanpura drone, plucked raga ----- */
  pluckBuf(freq, dur, damp){
    const key = freq.toFixed(2) + "|" + dur + "|" + damp;
    if(this.cache[key]) return this.cache[key];
    const c = this.ctx, sr = c.sampleRate, n = Math.floor(sr*dur), buf = c.createBuffer(1,n,sr), d = buf.getChannelData(0);
    const N = Math.max(2, Math.round(sr/freq));
    let prev = 0;
    for(let i=0;i<N && i<n;i++){ prev = prev*.45 + (Math.random()*2-1)*.55; d[i] = prev; }
    for(let i=N;i<n;i++) d[i] = damp*.5*(d[i-N] + (i-N-1 >= 0 ? d[i-N-1] : 0));
    const f = Math.min(n, Math.floor(sr*.1));
    for(let i=0;i<f;i++) d[n-1-i] *= i/f;
    return this.cache[key] = buf;
  },
  pluck(freq, t, vol, dur, damp, dest, wet){
    const c = this.ctx, s = c.createBufferSource(); s.buffer = this.pluckBuf(freq, dur, damp);
    const g = c.createGain(); g.gain.value = vol;
    s.connect(g); g.connect(dest || this.sweet); if(wet) g.connect(this.send);
    s.start(t);
  },
  bell(t){
    const c = this.ctx;
    [[1,.16,5],[2.01,.08,3.6],[2.76,.07,3],[4.07,.035,2],[5.43,.025,1.4]].forEach(([m,v,d]) => {
      const o = c.createOscillator(); o.type = "sine"; o.frequency.value = 587.33*m;
      const g = c.createGain(); g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(v, t+.004); g.gain.exponentialRampToValueAtTime(.0001, t+d);
      o.connect(g); g.connect(this.sweet); g.connect(this.send); o.start(t); o.stop(t+d+.05);
    });
  },
  tanpura(token){
    if(token !== this.token || !this.ctx) return;
    const t = this.ctx.currentTime + .05, S = 138.59;
    [[S*.75,0],[S,1.1],[S,1.95],[S/2,2.8]].forEach(([f,dt]) => this.pluck(f, t+dt, .34, 4.6, .9985, this.tan));
    setTimeout(() => this.tanpura(token), 4400);
  },
  raga(token, i){
    if(token !== this.token || !this.ctx) return;
    // An original phrase set in the scale of Raag Yaman
    const R = {S:1,R:9/8,G:5/4,m:45/32,P:3/2,D:5/3,N:15/8}, base = 277.18, beat = .3;
    const phrases = [
      [["N.",1],["R",1],["G",2],["R",1],["G",1],["m",1],["P",3]],
      [["m",1],["D",1],["N",2],["D",1],["P",1],["m",1],["G",3]],
      [["G",1],["m",1],["D",1],["N",1],["S'",2],["R'",1],["S'",1],["N",1],["D",1],["P",3]],
      [["P",1],["m",1],["G",1],["R",1],["G",2],["R",1],["S",1],["N.",1],["R",1],["S",4]]
    ];
    let t = this.ctx.currentTime + .1;
    for(const [n,b] of phrases[i % phrases.length]){
      const oct = n.endsWith("'") ? 2 : n.endsWith(".") ? .5 : 1, f = base*R[n[0]]*oct;
      this.pluck(f, t, .2, 2.4, .9955, null, true);
      this.pluck(f*1.004, t+.022, .08, 2.4, .9955, null, false);
      t += b*beat;
    }
    setTimeout(() => this.raga(token, i+1), (t - this.ctx.currentTime)*1000 + (i%2 ? 1500 : 500));
  },
  toDiwali(){
    if(!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    this.melodyOn = false;
    this.scary.gain.cancelScheduledValues(t);
    this.scary.gain.setValueAtTime(this.scary.gain.value, t);
    this.scary.gain.linearRampToValueAtTime(0, t+2.4);
    this.sweet.gain.cancelScheduledValues(t);
    this.sweet.gain.setValueAtTime(0, t);
    this.sweet.gain.linearRampToValueAtTime(1, t+.4);
    const token = ++this.token;
    this.bell(t+.2);
    setTimeout(() => this.tanpura(token), 1500);
  },
  startRaga(){
    if(!this.ctx || this.ragaOn) return;
    this.ragaOn = true; this.raga(this.token, 0);
  },

  /* ----- Fireworks: layered synthesis with an outdoor reverb ----- */
  setupFireworks(){
    const c = this.ctx;
    // gentle compressor so many bangs at once never distort
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = .002; comp.release.value = .25;
    comp.connect(this.master);
    this.fw = c.createGain(); this.fw.gain.value = 1; this.fw.connect(comp);

    // open-air reverb: a long dark tail plus a few echoes off distant buildings
    const sr = c.sampleRate, len = Math.floor(sr*3.6), ir = c.createBuffer(2, len, sr);
    for(let ch=0; ch<2; ch++){
      const d = ir.getChannelData(ch); let lp = 0;
      for(let i=0;i<len;i++){
        const t = i/len, k = .25 + .7*t;                       // darker as it decays
        lp = lp*k + (Math.random()*2-1)*(1-k);
        d[i] = lp*Math.pow(1-t, 3.2)*2.2;
      }
      [[.11,.55],[.24,.42],[.39,.3],[.62,.18],[.9,.1]].forEach(([s,a]) => {
        const at = Math.floor((s + (ch ? .013 : 0))*sr);
        for(let j=0;j<600;j++) d[at+j] += (Math.random()*2-1)*a*Math.exp(-j/120);
      });
    }
    this.verb = c.createConvolver(); this.verb.buffer = ir;
    const verbOut = c.createGain(); verbOut.gain.value = .9;
    this.verb.connect(verbOut); verbOut.connect(comp);

    // soft-clip curve that gives the booms their punch
    const curve = new Float32Array(1024);
    for(let i=0;i<1024;i++){ const x = i/511.5 - 1; curve[i] = Math.tanh(x*2.6)/Math.tanh(2.6); }
    this.clip = curve;
  },
  noiseSrc(){ const s = this.ctx.createBufferSource(); s.buffer = this.noise; s.loop = true; return s; },
  out(pan, wet){
    const c = this.ctx, g = c.createGain();
    let p = g;
    if(c.createStereoPanner){ p = c.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan || 0)); g.connect(p); }
    p.connect(this.fw);
    const w = c.createGain(); w.gain.value = wet ?? .5; g.connect(w); w.connect(this.verb);
    g.panner = p.pan ? p : null;
    return g;
  },
  // pops of burning stars, generated as one buffer so dense crackle stays cheap
  crackleBuf(dur, density){
    const key = dur + "|" + density + "|" + Math.floor(Math.random()*3);
    if(this.cache[key]) return this.cache[key];
    const c = this.ctx, sr = c.sampleRate, n = Math.floor(sr*dur), buf = c.createBuffer(1, n, sr), d = buf.getChannelData(0);
    const clusters = Math.floor(dur*density);
    for(let k=0;k<clusters;k++){
      let at = Math.floor(Math.pow(Math.random(), 1.5)*n*.92);
      const pops = 1 + Math.floor(Math.random()*5), fade = 1 - at/n*.65;
      for(let q=0;q<pops;q++){
        const L = Math.floor(sr*rand(.0012,.005)), amp = rand(.25,1)*fade, tone = rand(.15,.85);
        let lp = 0;
        for(let j=0;j<L && at+j<n;j++){
          lp = lp*tone + (Math.random()*2-1)*(1-tone);
          d[at+j] += (j === 0 ? amp*.9 : lp*amp*2.2*Math.exp(-j/(L*.28)));
        }
        at += Math.floor(sr*rand(.002,.028));
      }
    }
    let m = 0; for(let i=0;i<n;i++) m = Math.max(m, Math.abs(d[i]));
    if(m) for(let i=0;i<n;i++) d[i] /= m;
    return this.cache[key] = buf;
  },
  crackle(delay, dur, density, pan, vol){
    if(!this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay, s = c.createBufferSource();
    s.buffer = this.crackleBuf(dur, density);
    const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 700;
    const o = this.out(pan, .65); o.gain.value = vol ?? .5;
    s.connect(hp); hp.connect(o); s.start(t);
  },
  flicker(param, t, dur, peak, floor){
    const N = 64, curve = new Float32Array(N);
    for(let i=0;i<N;i++){ const k = i/(N-1); curve[i] = peak*(floor + (1-floor)*Math.random())*Math.pow(1-k, 1.3); }
    curve[N-1] = 0;
    param.setValueCurveAtTime(curve, t, dur);
  },
  rocket(T, panFrom, panTo, whistle){
    if(!this.ctx) return;
    const c = this.ctx, t = c.currentTime + .01;
    const o = this.out(panFrom, .35);
    if(o.panner) o.panner.pan.linearRampToValueAtTime(panTo, t + T);
    // mortar "thoomp"
    const th = this.noiseSrc(), thLP = c.createBiquadFilter(); thLP.type = "lowpass"; thLP.frequency.value = 520;
    const thG = c.createGain(); thG.gain.setValueAtTime(.55, t); thG.gain.exponentialRampToValueAtTime(.001, t+.14);
    th.connect(thLP); thLP.connect(thG); thG.connect(o); th.start(t, Math.random()); th.stop(t+.16);
    const sub = c.createOscillator(); sub.frequency.setValueAtTime(150, t); sub.frequency.exponentialRampToValueAtTime(48, t+.16);
    const subG = c.createGain(); subG.gain.setValueAtTime(.6, t); subG.gain.exponentialRampToValueAtTime(.001, t+.2);
    sub.connect(subG); subG.connect(o); sub.start(t); sub.stop(t+.22);
    // rushing, sputtering hiss of the climb
    const h = this.noiseSrc(), bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = .9;
    bp.frequency.setValueAtTime(1500, t); bp.frequency.exponentialRampToValueAtTime(3600, t+T);
    const hG = c.createGain(); hG.gain.setValueAtTime(0, t); hG.gain.linearRampToValueAtTime(.12, t+.07);
    this.flicker(hG.gain, t+.075, Math.max(.2, T-.075), .12, .45);
    h.connect(bp); bp.connect(hG); hG.connect(o); h.start(t, Math.random()); h.stop(t+T+.05);
    // some rockets whistle
    if(whistle){
      const w = c.createOscillator(); w.type = "sawtooth";
      w.frequency.setValueAtTime(1150, t+.05); w.frequency.exponentialRampToValueAtTime(3100, t+T);
      const vib = c.createOscillator(); vib.frequency.value = 23; const vg = c.createGain(); vg.gain.value = 35;
      vib.connect(vg); vg.connect(w.frequency);
      const wf = c.createBiquadFilter(); wf.type = "bandpass"; wf.Q.value = 9;
      wf.frequency.setValueAtTime(1150, t+.05); wf.frequency.exponentialRampToValueAtTime(3100, t+T);

  burst(delay, pan, size){
    if(!this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay;
    const o = this.out(pan, .8);
    // sharp crack
    const cr = this.noiseSrc(), hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 900;
    const crG = c.createGain(); crG.gain.setValueAtTime(.9*size, t); crG.gain.exponentialRampToValueAtTime(.001, t+.05);
    cr.connect(hp); hp.connect(crG); crG.connect(o); cr.start(t, Math.random()); cr.stop(t+.06);

    // chest thump
    const s = c.createOscillator(); s.frequency.setValueAtTime(82, t); s.frequency.exponentialRampToValueAtTime(30, t+.45);
    const sG = c.createGain(); sG.gain.setValueAtTime(0, t); sG.gain.linearRampToValueAtTime(.85*size, t+.006);
    sG.gain.exponentialRampToValueAtTime(.001, t+.6);
    s.connect(sG); sG.connect(o); s.start(t); s.stop(t+.65);
    // long rolling rumble across the sky
    const r = this.noiseSrc(), rl = c.createBiquadFilter(); rl.type = "lowpass"; rl.frequency.value = 170;
    const rG = c.createGain(); rG.gain.setValueAtTime(0, t); rG.gain.linearRampToValueAtTime(.32*size, t+.12);
    rG.gain.exponentialRampToValueAtTime(.001, t+3.4);

  sizzle(delay, dur, pan){
    if(!this.ctx) return;

    s.connect(hp); hp.connect(g); g.connect(o); s.start(t, Math.random()); s.stop(t+dur+.4);
  },
  fuse(dur){
    if(!this.ctx) return;
    const c = this.ctx, t = c.currentTime, s = this.noiseSrc();
    const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 5000;
    const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t+.05);

  },
  fountain(delay, dur){
    if(!this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay, o = this.out(0, .45);

    [[ "bandpass", 1100, .6, .2 ], [ "highpass", 3800, .7, .09 ], [ "lowpass", 260, .7, .12 ]].forEach(([type, f, q, peak]) => {
      const s = this.noiseSrc(), fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
      const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t+.35);

      g.gain.setValueCurveAtTime(cv, t+.36, dur-.36);

    });

  },

  toggle(){

    $("muteBtn").setAttribute("aria-label", this.muted ? "Play music" : "Mute music");
    $("muteBtn").title = this.muted ? "Play music" : "Mute music";
  }
};

/* =========================================================
   ✨ PARTICLE ENGINES
   fw  = fireworks in the sky (behind the card, with light trails)
   fx  = sparks in front (scratch embers, the anaar fountain)
   ========================================================= */
function makeEngine(canvas, trails){
  const c = canvas.getContext("2d");
  const E = { P:[], R:[], W:0, H:0, onFrame:null, keepAlive:null, running:false };
  let last = 0, idle = 0;
  E.size = () => {
    const d = Math.min(devicePixelRatio||1, 2);
    E.W = innerWidth; E.H = innerHeight;
    canvas.width = E.W*d; canvas.height = E.H*d; c.setTransform(d,0,0,d,0,0);
  };
  E.add = p => {
    if(E.P.length > 2600) return;
    E.P.push(Object.assign({vx:0,vy:0,g:0,drag:1,life:1,decay:.02,s:1.5,c:"#ffd27a",streak:0,tw:false,fi:false}, p));
    E.start();
  };
  E.rocket = r => { E.R.push(r); E.start(); };
  E.start = () => { if(E.running) return; E.running = true; last = 0; idle = 0; requestAnimationFrame(tick); };
  E.clear = () => { E.P.length = 0; E.R.length = 0; };
  function tick(now){
    const dt = last ? Math.min(3, (now-last)/16.667) : 1; last = now;
    if(E.onFrame) E.onFrame(dt);
    if(trails){ c.globalCompositeOperation = "destination-out"; c.fillStyle = "rgba(0,0,0,.2)"; c.fillRect(0,0,E.W,E.H); }
    else c.clearRect(0,0,E.W,E.H);
    c.globalCompositeOperation = "lighter";

    for(let i=E.R.length-1;i>=0;i--){
      const r = E.R[i];
      r.t += dt/60;
      const k = Math.min(1, r.t/r.T), e = 1 - Math.pow(1-k, 2.3);
      const x = r.x0 + (r.x1-r.x0)*e + Math.sin(r.t*14)*1.2, y = r.y0 + (r.y1-r.y0)*e;
      E.add({x, y, vx:rand(-.3,.3), vy:rand(.3,1.3), g:.03, drag:.96, decay:rand(.035,.06), s:rand(.8,1.5), c:"#ffcf8a"});
      c.globalAlpha = 1; c.fillStyle = "#fff8e8"; c.beginPath(); c.arc(x,y,2.1,0,6.283); c.fill();
      if(k >= 1){ E.R.splice(i,1); r.burst(x,y); }
    }

    const P = E.P;
    for(let i=P.length-1;i>=0;i--){
      const p = P[i];
      p.vx *= p.drag; p.vy = p.vy*p.drag + p.g*dt;
      p.x += p.vx*dt; p.y += p.vy*dt; p.life -= p.decay*dt;
      if(p.life <= 0){ P[i] = P[P.length-1]; P.pop(); continue; }
      let a = p.life;
      if(p.fi) a = Math.min(a, (1-p.life)*5);
      if(p.tw && p.life < .55) a *= Math.random() < .5 ? 1 : .12;
      c.globalAlpha = a > 1 ? 1 : a;
      if(p.streak){
        c.strokeStyle = p.c; c.lineWidth = p.s; c.lineCap = "round";
        c.beginPath(); c.moveTo(p.x - p.vx*p.streak, p.y - p.vy*p.streak); c.lineTo(p.x, p.y); c.stroke();
      } else {
        c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, p.s, 0, 6.283); c.fill();
      }
    }
    c.globalAlpha = 1;
    const alive = P.length || E.R.length || (E.keepAlive && E.keepAlive());
    if(alive){ idle = 0; requestAnimationFrame(tick); }
    else if(trails && idle++ < 45) requestAnimationFrame(tick);
    else { E.running = false; c.globalCompositeOperation = "source-over"; c.clearRect(0,0,E.W,E.H); }
  }
  return E;
}

  SKY.rocket({x0, y0, x1, y1, T, t:0, burst:(x,y) => Bursts[type](x, y, cols)});
  const pan = v => Math.max(-.85, Math.min(.85, (v/W*2 - 1)*.9));
  const far = rand(.06,.2);                                   // sound travels slower than light
  const size = type === "heart" ? 1.2 : rand(.55,.95);
  Sound.rocket(T, pan(x0), pan(x1), Math.random() < .35);
  Sound.burst(T + far, pan(x1), size);
  if(type === "willow") Sound.sizzle(T + far + .25, 2.8, pan(x1));
  if(type === "double" || type === "heart" || Math.random() < .5) Sound.crackle(T + far + rand(.45,.8), 1.8, rand(60,110), pan(x1), .5);
}
function randomLaunch(){
  const r = Math.random();
  if(r < .3) launch("peony", pick([PAL.gold, PAL.rani, PAL.teal, PAL.violet, PAL.marigold, PAL.green]));
  else if(r < .55) launch("ring", pick([PAL.teal, PAL.rani, PAL.violet]));
  else if(r < .78) launch("willow");
  else launch("double", pick([PAL.rani, PAL.teal, PAL.marigold]));
}
function ambientShow(){
  clearTimeout(ambientTimer);
  if(!lit) return;
  if(!document.hidden){ randomLaunch(); if(Math.random() < .35) setTimeout(randomLaunch, rand(250,700)); }
  ambientTimer = setTimeout(ambientShow, rand(3200,7000));
}

/* ---------- Anaar fountain + fuse (front layer) ---------- */
let fuseUntil = 0, fountainFrom = 0, fountainUntil = 0;
const centerOf = el => { const r = el.getBoundingClientRect(); return {x:r.left + r.width/2, y:r.top + r.height/2}; };
FX.keepAlive = () => performance.now() < fountainUntil;
FX.onFrame = dt => {
  const now = performance.now();
  if(now < fuseUntil){
    const p = centerOf($("wickTip")), k = 1 - (fuseUntil - now)/700;
    const fx = p.x - 6*k*.9, fy = p.y + 13*k;            // spark travels down the wick
    for(let i=0;i<4;i++) FX.add({x:fx, y:fy, vx:rand(-2.2,2.2), vy:rand(-2.6,.8), g:.12, drag:.95, decay:rand(.05,.09), s:rand(.6,1.2), c:pick(["#fff6d8","#ffd27a"]), streak:2});
  }
  if(now >= fountainFrom && now < fountainUntil){
    const p = centerOf($("mouth")), k = Math.min(1, (now - fountainFrom)/500), n = Math.round(13*k*dt);
    for(let i=0;i<n;i++) FX.add({x:p.x + rand(-2,2), y:p.y, vx:rand(-1.9,1.9), vy:-rand(5,10.5)*Math.min(1.25, innerHeight/700),
      g:.24, drag:.99, decay:rand(.017,.03), s:rand(1,2.1), c:pick(["#fff6d8","#ffe29a","#ffd27a","#ffb347","#ff8c42"]), streak:1.6});
  }
};

/* =========================================================
   🎃 SCRATCH CARD
   ========================================================= */
const batPath = new Path2D(BAT_D);
const canvas = $("scratch"), ctx = canvas.getContext("2d", { willReadFrequently:true });
let dpr = 1, drawing = false, last = null, moves = 0, lastP = 0, lastBeat = 0;

function poly(points, ox, oy, s){
  ctx.beginPath();
  points.forEach(([x,y],i) => i ? ctx.lineTo(ox+x*s, oy+y*s) : ctx.moveTo(ox+x*s, oy+y*s));
  ctx.closePath();
}
function web(ox,oy,r,dir){
  ctx.save(); ctx.strokeStyle = "rgba(255,245,235,.4)"; ctx.lineWidth = 1*dpr;
  const spokes = 6, a0 = dir>0 ? 0 : Math.PI, a1 = a0 + Math.PI/2;
  for(let i=0;i<=spokes;i++){ const a = a0+(a1-a0)*i/spokes; ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+Math.cos(a)*r, oy+Math.sin(a)*r); ctx.stroke(); }
  for(let k=1;k<=5;k++){
    const rr = r*k/5.3; ctx.beginPath();
    for(let i=0;i<=spokes;i++){
      const a = a0+(a1-a0)*i/spokes, px = ox+Math.cos(a)*rr, py = oy+Math.sin(a)*rr;
      if(i===0) ctx.moveTo(px,py);
      else { const am = a0+(a1-a0)*(i-.5)/spokes, sag = rr*.86; ctx.quadraticCurveTo(ox+Math.cos(am)*sag, oy+Math.sin(am)*sag, px, py); }
    }
    ctx.stroke();
  }
  ctx.restore();
}
function crack(x,y,steps,s){
  ctx.beginPath(); ctx.moveTo(x,y);
  for(let i=0;i<steps;i++){ x += rand(-14,14)*s; y += rand(8,20)*s; ctx.lineTo(x,y); }
  ctx.stroke();
}
function paintFoil(){
  const rect = canvas.getBoundingClientRect();
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(rect.width*dpr)); canvas.height = Math.max(1, Math.round(rect.height*dpr));
  const w = canvas.width, h = canvas.height, cx = w/2, cy = h/2, s = w/390;
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  const base = ctx.createRadialGradient(cx, cy*.85, w*.05, cx, cy, Math.max(w,h)*.7);
  base.addColorStop(0,"#ff8f2a"); base.addColorStop(.4,"#d4520f"); base.addColorStop(.8,"#6e1c06"); base.addColorStop(1,"#2e0a04");
  ctx.fillStyle = base; ctx.fillRect(0,0,w,h);
  const ribs = 7, rw = w/ribs;
  for(let i=0;i<ribs;i++){
    const x0 = i*rw, g = ctx.createLinearGradient(x0,0,x0+rw,0);
    g.addColorStop(0,"rgba(60,15,0,.5)"); g.addColorStop(.5,"rgba(255,190,110,.1)"); g.addColorStop(1,"rgba(60,15,0,.5)");
    ctx.fillStyle = g; ctx.fillRect(x0,0,rw+1,h);
  }
  ctx.strokeStyle = "rgba(40,10,0,.35)"; ctx.lineWidth = 2*dpr;
  for(let i=1;i<ribs;i++){ const x = i*rw, bend = (x-cx)*.12; ctx.beginPath(); ctx.moveTo(x-bend,0); ctx.quadraticCurveTo(x+bend,cy,x-bend,h); ctx.stroke(); }
  const grains = (w*h)/70;
  for(let i=0;i<grains;i++){
    ctx.fillStyle = Math.random()>.55 ? "rgba(255,210,160,.16)" : "rgba(30,5,0,.16)";
    ctx.fillRect(Math.random()*w, Math.random()*h, dpr, dpr);
  }
  for(let i=0;i<8;i++){
    const x = rand(0,w), y = rand(0,h), r = rand(10,34)*s;
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,"rgba(40,15,5,.45)"); g.addColorStop(1,"rgba(40,15,5,0)");
    ctx.fillStyle = g; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  ctx.strokeStyle = "rgba(20,4,0,.55)"; ctx.lineWidth = 1.6*dpr;
  crack(w*.12,0,8,s); crack(w*.88,0,6,s); crack(w*.62,h*.74,5,s);
  const vig = ctx.createRadialGradient(cx,cy,w*.25,cx,cy,Math.max(w,h)*.68);
  vig.addColorStop(0,"rgba(0,0,0,0)"); vig.addColorStop(1,"rgba(10,0,0,.6)");
  ctx.fillStyle = vig; ctx.fillRect(0,0,w,h);
  web(0,0,w*.42,1); web(w,h,w*.34,-1);

  const ey = cy - 88*s, my = cy + 64*s;
  const glow = ctx.createRadialGradient(cx, cy-10*s, 5*s, cx, cy, 200*s);
  glow.addColorStop(0,"#fff6b0"); glow.addColorStop(.35,"#ffc233"); glow.addColorStop(.75,"#ff6a00"); glow.addColorStop(1,"#c42a00");
  ctx.save();
  ctx.shadowColor = "rgba(255,170,30,1)"; ctx.shadowBlur = 26*s;
  ctx.fillStyle = glow;
  poly([[-82,-14],[-20,8],[-58,30]], cx, ey, s); ctx.fill();
  poly([[82,-14],[20,8],[58,30]], cx, ey, s); ctx.fill();
  poly([[0,22],[-11,44],[11,44]], cx, ey, s); ctx.fill();
  poly([
    [-112,-18],[-72,-2],[-58,-2],[-50,18],[-40,0],[6,4],[15,24],[24,4],[62,-2],[112,-18],
    [92,6],[64,24],[56,8],[46,30],[4,40],[-18,38],[-27,18],[-36,36],[-78,20]
  ], cx, my, s); ctx.fill();
  ctx.restore();

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `${40*s}px Creepster, "IM Fell English", Georgia, serif`;
  ctx.fillStyle = "rgba(255,200,140,.4)"; ctx.fillText("Scratch if you dare", cx, cy+2*s+1.5*dpr);
  ctx.fillStyle = "#1e0602"; ctx.fillText("Scratch if you dare", cx, cy+2*s);
  ctx.font = `600 ${12.5*s}px Figtree, system-ui, sans-serif`;
  ctx.fillStyle = "rgba(255,210,170,.7)";
  ctx.fillText("something is hiding underneath…", cx, cy+128*s);
  ctx.fillStyle = "rgba(10,2,0,.6)";
  [[.8,.1,.9],[.88,.18,.6],[.14,.9,.7]].forEach(([x,y,k]) => {
    ctx.save(); ctx.translate(w*x, h*y); ctx.scale(k*s*1.1, k*s*1.1); ctx.translate(-20,-9); ctx.fill(batPath); ctx.restore();
  });
}
function pos(e){
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX-r.left)*dpr, y:(e.clientY-r.top)*dpr, cx:e.clientX, cy:e.clientY };
}
function scratch(a,b){
  ctx.globalCompositeOperation = "destination-out";
  ctx.lineWidth = 46*dpr; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  if(!reduceMotion) for(let i=0;i<3;i++)
    FX.add({x:b.cx, y:b.cy, vx:rand(-.9,.9), vy:-rand(.3,1.9), g:.03, decay:rand(.02,.04), s:rand(.8,2.6), c:Math.random()>.4 ? "#ffb13b" : "#ff3a12"});
  const now = performance.now(), gap = 1150 - lastP*750;
  if(now - lastBeat > gap){ lastBeat = now; Sound.heartbeat(.6 + lastP*.8); }
}
function progress(){
  const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
  let clear = 0, total = 0;
  for(let i=3;i<data.length;i+=4*24){ total++; if(data[i] < 40) clear++; }
  const p = clear/total; lastP = Math.min(1, p/CONFIG.revealAt);
  const shown = Math.round(lastP*100);
  $("bar").style.width = shown+"%"; $("pct").textContent = shown+"%";
  if(p >= CONFIG.revealAt) reveal();
}
function begin(){ if(started) return; started = true; $("hint").classList.add("off"); }

canvas.addEventListener("pointerdown", e => {
  if(revealed) return;
  drawing = true; try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  last = pos(e); begin(); scratch(last,last);
});
canvas.addEventListener("pointermove", e => {
  if(!drawing || revealed) return;
  let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  if(!evs.length) evs = [e];
  for(const ev of evs){ const p = pos(ev); scratch(last,p); last = p; }
  if(++moves % 6 === 0) progress();
});
["pointerup","pointercancel"].forEach(t => canvas.addEventListener(t, () => { if(drawing){ drawing = false; progress(); } }));

/* =========================================================
   🌗 STAGE 1 → 2: Halloween melts into a Diwali night
   ========================================================= */
function reveal(){
  if(revealed) return; revealed = true; drawing = false;
  const card = $("card"), r = card.getBoundingClientRect();
  document.documentElement.style.setProperty("--wx", (r.left + r.width/2) + "px");
  document.documentElement.style.setProperty("--wy", (r.top + r.height/2) + "px");

  document.body.classList.add("sweet", "diwali");
  clearTimeout(lightningTimer);
  eyes.forEach(e => e.classList.remove("on"));
  canvas.classList.add("gone"); $("hint").classList.add("off");
  card.classList.add("revealed");
  $("bar").style.width = "100%"; $("pct").textContent = "100%";
  $("meter").classList.add("done");
  setScene(true);
  Sound.toDiwali();
  SKY.start();
  if(navigator.vibrate) navigator.vibrate([30,50,30]);
  if(reduceMotion) return;
  warmFlash(.28);
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for(let i=0;i<140;i++){
    const a = rand(0,6.283), sp = rand(2,9);
    FX.add({x:cx + Math.cos(a)*r.width*.3, y:cy + Math.sin(a)*r.height*.3, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1.5, g:.12, drag:.96,
      decay:rand(.012,.022), s:rand(1,2.2), c:pick(["#fff3cf","#f6d27a","#ffb347","#ff7ac0"]), streak:1.4});
  }
  setTimeout(() => $("card").scrollIntoView({behavior:"smooth", block:"center"}), 900);
}

/* =========================================================
   🎆 STAGE 2 → 3: light the firework, reveal the photos
   ========================================================= */
function lightFirework(){
  if(!revealed || lit || $("card").classList.contains("igniting")) return;
  const card = $("card");
  card.classList.add("igniting");
  const m = $("mouth").getBoundingClientRect(), cr = card.getBoundingClientRect();
  card.style.setProperty("--cx", ((m.left + m.width/2 - cr.left)/cr.width*100) + "%");
  card.style.setProperty("--cy", ((m.top + m.height/2 - cr.top)/cr.height*100) + "%");

  if(reduceMotion){ later(showNews, 200); return; }

  const now = performance.now();
  fuseUntil = now + 700; fountainFrom = now + 700; fountainUntil = now + 3500;
  FX.start();
  Sound.fuse(.75); Sound.fountain(.7, 2.8);

  const W = innerWidth, H = innerHeight;
  later(() => launch("peony", PAL.gold, {x:W*.24, y:H*.22, T:1.25}), 1000);
  later(() => launch("ring", PAL.teal, {x:W*.78, y:H*.2, T:1.2}), 1450);
  later(() => launch("heart", null, {x:W*.5, y:H*.2, T:1.45}), 1900);
  later(showNews, 3350);
  later(() => launch("willow", null, {x:W*.32, y:H*.16}), 4200);
  later(() => launch("double", PAL.rani, {x:W*.7, y:H*.26}), 4900);
  later(() => launch("peony", PAL.violet), 5600);
  later(() => launch("ring", PAL.marigold), 6200);
  later(ambientShow, 8500);
}
function showNews(){
  lit = true;
  const card = $("card");
  card.classList.add("lit");
  warmFlash(reduceMotion ? 0 : .22);
  Sound.startRaga();
  later(() => { $("after").classList.add("show"); }, 700);
  later(() => Slideshow.play(), 1700);
  later(() => $("after").scrollIntoView({behavior:"smooth", block:"nearest"}), 1500);
}
$("lightBtn").onclick = lightFirework;
$("anaar").onclick = lightFirework;

/* ---------- Watch again ---------- */
$("againBtn").onclick = () => {
  showTimers.forEach(clearTimeout); showTimers = []; clearTimeout(ambientTimer);
  fuseUntil = fountainFrom = fountainUntil = 0;
  SKY.clear(); FX.clear();
  revealed = false; lit = false; started = false; moves = 0; lastP = 0;
  const card = $("card");
  card.classList.remove("revealed","igniting","lit");
  document.body.classList.remove("sweet","diwali");
  Slideshow.reset();
  setScene(false);
  canvas.classList.remove("gone"); $("after").classList.remove("show"); $("meter").classList.remove("done");
  $("hint").classList.remove("off");
  $("bar").style.width = "0"; $("pct").textContent = "0%";
  paintFoil(); card.scrollIntoView({behavior:"smooth",block:"center"});
  if(Sound.ctx) Sound.startScary();
  setTimeout(() => lightning(false), 1500);
  scheduleEyes();
};

$("shareBtn").onclick = async () => {
  const data = { title:CONFIG.headline, text:"Enter if you dare… scratch the pumpkin, then light the firework 🎃🪔", url:location.href };
  try{
    if(navigator.share){ await navigator.share(data); return; }
    await navigator.clipboard.writeText(location.href); toast("Link copied");
  }catch(err){ if(err.name !== "AbortError") toast("Copy the link from your address bar"); }
};
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }

/* ---------- Init ---------- */
let rt, lastW = innerWidth;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => {
  sizeSky(); sizeBolt(); SKY.size(); FX.size();
  if(innerWidth !== lastW){ buildToran(); if(!revealed && !started) paintFoil(); }
  lastW = innerWidth;
}, 150); });
sizeBolt();
paintFoil();
if(document.fonts) document.fonts.ready.then(() => { if(!started) paintFoil(); });
</script>
